name: Apply scout-off 238 patch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-scout238.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out claimant fork
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - name: Prepare literal sponsor main
        run: |
          git config user.name "tokenjunkielabs"
          git config user.email "brycembusiness2@gmail.com"
          git remote add sponsor https://github.com/scout-off/scout-off-contracts.git
          git fetch sponsor main
          git checkout -B zz-sol-variance7/scout238-validator-reuse sponsor/main

      - name: Apply issue 238 source change
        run: |
          echo '' | base64 -d > /tmp/scout238_patch.py
          python /tmp/scout238_patch.py

      - name: Publish clean source branch
        run: |
          git add contracts/verification/src/lib.rs
          git commit -m "perf(verification): reuse loaded validator on milestone commit"
          git push origin HEAD:refs/heads/zz-sol-variance7/scout238-validator-reuse

      - name: Remove one-shot transport workflow
        if: always()
        run: |
          git config user.name "tokenjunkielabs"
          git config user.email "brycembusiness2@gmail.com"
          git fetch origin main
          git checkout -B main origin/main
          if [ -f .github/workflows/apply-scout238.yml ]; then
            git rm .github/workflows/apply-scout238.yml
            git commit -m "chore: remove scout 238 one-shot transport"
            git push origin main
          fi
